trigger: none

pool: Default

stages:
  - stage: terraforminstall
    displayName: terraform install

    jobs:
      - job: terraform
        displayName: terraform init

        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ado_connection'
              backendAzureRmStorageAccountName: 'sunnystorage12'
              backendAzureRmContainerName: 'consunny'
              backendAzureRmKey: 'vijay-yaml'

        
          - task: TerraformTask@5
            displayName: terrafrom validate
            inputs:
             provider: 'azurerm'
             command: 'validate'

          - task: TerraformTask@5
            displayName: terraform plan
            inputs:
               provider: 'azurerm'
               command: 'plan'

      
